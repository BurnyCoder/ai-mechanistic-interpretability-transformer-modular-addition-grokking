[project]
name = "modular-addition-transformer"
version = "0.1.0"
description = "Training a 1-layer transformer on modular addition and analyzing the grokking phenomenon"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.5.0",
    "einops>=0.8.2",
    "fancy-einsum>=0.0.3",
    "nbformat>=5.10.4",
    "plotly>=6.5.2",
    "transformer-lens>=2.17.0",
    "transformers>=4.57.6",
    "neel-plotly @ git+https://github.com/neelnanda-io/neel-plotly.git",
]
